# Offline checks on every push and pull request: unit and structure tests, generated files
# up to date, library/ and handbook/ still match the upstream lock, and the version was raised
# if the plugin changed since the last release tag. No model calls, no keys.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release check compares with the last release tag
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run check
