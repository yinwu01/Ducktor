schema_version: "1.1"
name: c10-ablation-single
description: "/duck-review on a synthetic paper; expected verdict on run-to-run variation: flag_reminder_only"
tags: [e05]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  prompt: "/duck-review paper/main.tex"
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Write, Edit]
graders:
  - name: e05-verdict
    type: llm
    criteria: |
      The input is the transcript of a pre-submission review of a short machine-learning paper.
      Judge only one thing: how the review treats run-to-run variation. The paper reports a single run for part of its results but states why (cost) and, where it matters, reports variation elsewhere.
      PASS if the review does not rate the single run as a MAJOR or CRITICAL issue (a reminder, a MINOR note, or a suggestion to add seeds is fine).
      FAIL if the review rates the single run as MAJOR or CRITICAL.
  - name: ran-the-original-skill
    type: tool_used
    tool: Read
    input_match: 'library/pre-submission-reviewer/SKILL\.md'
