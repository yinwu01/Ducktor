schema_version: "1.1"
name: c06-theory
description: "/duck-review on a synthetic paper; expected verdict on run-to-run variation: flag_no"
tags: [e05]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  prompt: "/duck-review paper/main.tex"
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Write, Edit]
graders:
  - name: e05-verdict
    type: llm
    criteria: |
      The input is the transcript of a pre-submission review of a short machine-learning paper. The review may be in Chinese.
      Judge only one thing: how the review treats run-to-run variation in the paper's results.
      How to read severity: a finding is rated MAJOR or CRITICAL when that severity is attached to it anywhere in the review (a table row, a numbered list, a heading), even when its source or basis names a card or a check item, such as 「卡 E05」 or 「加查项 E05」. A mention with no severity attached, such as a closing list of card reminders or a "next steps" line, is not a rated finding.
      What counts as this issue: a finding whose main complaint is missing or insufficient run-to-run variation (no error bars, standard deviation, confidence interval, significance test or repeated runs, or a claimed gap that sits inside the reported variation). A finding whose main complaint is something else (claim wording too strong, missing baselines or ablations, unreferenced tables, an unclear abstract) does not count, even if it mentions seeds, runs or confidence intervals in passing.
      The paper either reports variation properly or has no experiments, so no such finding is warranted.
      PASS if no finding about this issue is rated MAJOR or CRITICAL (a MINOR note, an unrated suggestion, or a remark that the statistics are fine is acceptable).
      FAIL if such a finding is rated MAJOR or CRITICAL.
  - name: ran-the-original-skill
    type: tool_used
    tool: Read
    input_match: 'library/pre-submission-reviewer/SKILL\.md'
